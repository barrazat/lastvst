name: Build Black Magic (VST3)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar VST3
        run: cmake --build build --config Release --target BlackMagic_VST3 --parallel

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        with:
          name: BlackMagic-VST3-Windows
          path: build/BlackMagic_artefacts/Release/VST3/
          if-no-files-found: error
